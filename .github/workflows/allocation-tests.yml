name: Allocation tests
on:
  push:
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/allocation-tests.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/allocation-tests.yml'
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate allocation invariants
        run: python -m unittest discover -s tests -v
